version: '3.8'

services:
  backend:
    build: ./backend
    image: ecslearning/docker-compose-learning-backend:latest
    ports:
      - "5000:5000"
    volumes:
      - backend-data:/app/data
    networks:
      - app-network

  frontend:
    build: ./frontend
    image: ecslearning/docker-compose-learning-frontend:latest
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://13.201.223.157:5000}
    ports:
      - "3000:5173"
    networks:
      - app-network

volumes:
  backend-data:

networks:
  app-network:
    driver: bridge
